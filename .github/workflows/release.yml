name: Release

# Publishes the package to npm when a version tag such as 2.5.2 is pushed.
# npm trusts this workflow (trusted publishing with OIDC), so there is no npm token and no 2FA prompt.
# Run the workflow by hand on the default branch to check the trusted publisher setup.
# That run publishes nothing.
#
# Only the publish and check jobs may request an OIDC token. The verify job runs the
# repository scripts (install, lint, tests) without that permission.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        if: github.event_name == 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(jq -r '.version' package.json)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in package.json."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::The tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm pack --dry-run

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Again here, before any repository code runs with the OIDC permission
      - name: Check the tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(jq -r '.version' package.json)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in package.json."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::The tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check the npm version
        # Trusted publishing needs npm 11.5.1 or newer
        run: |
          npm --version
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)"

      # No install scripts of dependencies while this job may request an OIDC token
      - run: npm ci --ignore-scripts

      - name: Publish
        run: npm publish

  check-trusted-publisher:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Asks npm for a publish token the same way npm publish does, and only reports the result.
      # A success shows that owner, repository, workflow and environment match. It does not show
      # that direct publishing with npm publish is allowed. That is a separate setting on npmjs.com.
      - name: Check the trusted publisher without publishing
        run: |
          name=$(jq -r '.name | sub("/"; "%2f")' package.json)
          id_token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          code=$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name")
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && jq -e '.token' "$RUNNER_TEMP/exchange.json" > /dev/null; then
            echo "Trusted publisher works: npm accepted this workflow for $name."
          else
            echo "::error::npm refused the token exchange (HTTP $code): $(jq -r '.message // .error // "no message"' "$RUNNER_TEMP/exchange.json")"
            rm -f "$RUNNER_TEMP/exchange.json"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/exchange.json"
